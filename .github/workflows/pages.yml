name: Pages

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm test
            # fork করলে রিপোর নাম নিজে থেকেই base হয়; <user>.github.io রিপোতে base হয় /
            - name: Build
              env:
                  REPO: ${{ github.event.repository.name }}
              run: |
                  if [[ "$REPO" == *.github.io ]]; then BASE=/; else BASE="/$REPO/"; fi
                  node alo build --base "$BASE"
            - uses: actions/configure-pages@v6
            - uses: actions/upload-pages-artifact@v5
              with:
                  path: dist
            - id: deployment
              uses: actions/deploy-pages@v5
